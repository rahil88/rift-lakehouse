name: rift
version: "1.0.0"
config-version: 2
profile: rift

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "logs"]

# Free Edition has one 2X-Small warehouse shared by everything: keep models simple and serial-ish.
models:
  rift:
    +file_format: delta
    silver:
      +schema: rift_silver
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
    gold:
      +schema: rift_gold
      +materialized: table
    marts:
      +schema: rift_gold
      +materialized: table

snapshots:
  rift:
    +target_schema: rift_gold

vars:
  wilson_z: 1.96 # 95% confidence
  remake_max_seconds: 300 # games shorter than this are remakes, excluded from win rates
