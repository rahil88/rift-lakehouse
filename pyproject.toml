[project]
name = "rift-lakehouse"
version = "0.1.0"
description = "League of Legends match data lakehouse: Riot API -> data contracts -> Redpanda -> Databricks (Delta, Unity Catalog) -> dbt -> Airflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime deps are added phase by phase, each pinned exactly. uv.lock pins the transitive tree.
dependencies = [
    "confluent-kafka==2.16.1",
    "databricks-sdk==0.117.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]

[dependency-groups]
dbt = [
    "dbt-core==1.12.6",
    "dbt-databricks==1.13.0",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
# `uv sync` installs dev + dbt; the Airflow image installs dbt into its own venv (Phase 5).
default-groups = ["dev", "dbt"]
# Not built as a wheel: collector/, consumer/, quality/ are imported from the repo root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify, ANN type hints
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
